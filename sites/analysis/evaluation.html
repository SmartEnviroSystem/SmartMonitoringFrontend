<!DOCTYPE html>
<html lang="de">
    <head>
        <title>SmartMonitoring - HELIOS-Auswertung</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="32x32" href="../../files/icons/32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../../files/icons/16x16.png">
        <link rel="stylesheet" href="../../css/global.css">
        <link rel="stylesheet" href="/SWAC/swac/libs/uikit/css/uikit.min.css">
        <script src="/SWAC/swac/libs/uikit/js/uikit.min.js"></script>
        <script src="/SWAC/swac/libs/uikit/js/uikit-icons.min.js"></script>
        <script src="/SWAC/swac/swac.js" type="module"></script>
        <script src="../../js/analysis/evaluation.js" defer></script>
        <link rel="stylesheet" href="../../customisations/global.css">
        <style>
            .f6-evaluation { max-width: 1440px; margin: 0 auto; }
            .f6-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
            .f6-panel { min-width: 0; }
            .f6-placeholder {
                min-height: 240px; padding: 1.5rem; border: 2px dashed #a7b5c1;
                background: #f7f9fb; display: flex; flex-direction: column;
                align-items: center; justify-content: center; text-align: center;
            }
            .f6-placeholder p { max-width: 32rem; margin: 0.5rem 0; }
            @media (min-width: 960px) {
                .f6-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            }
        </style>
    </head>
    <body>
        <nav id="main_navigation" class="swac_navigation_head" swa="Navigation FROM tbl_navigationroute WHERE filter=active,eq,true AND order=id,ASC"></nav>
        <div id="userform" swa="User"></div>
        <div id="translate" swa="Translator FROM ../../data/languages/translations.json"></div>
        <div class="section">
        <article class="f6-evaluation uk-article">
            <h1 class="uk-heading-bullet">HELIOS-Auswertung</h1>
            <div class="uk-alert-primary" uk-alert>
            </div>
            <div id="f6_evaluation_panels" class="f6-grid"></div>
            <noscript><p>Bitte JavaScript aktivieren, um die vier Platzhalter anzuzeigen.</p></noscript>
        </article>
        </div>
        <div id="favs" swa="Favourites"></div>
    </body>
</html>
