<!DOCTYPE html>
<html lang="de">
    <head>
        <title swac_lang="data_heatmap_title">Data &gt; Heatmap</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="32x32" href="../../files/icons/32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../../files/icons/16x16.png">
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="/SWAC/swac/libs/uikit/css/uikit.min.css" />
        <script src="/SWAC/swac/libs/uikit/js/uikit.min.js"></script>
        <script src="/SWAC/swac/libs/uikit/js/uikit-icons.min.js"></script>
        <script src="../../js/analysis/heatmap.js" type="module"></script>
        <script src="/SWAC/swac/swac.js" type="module"></script>
        <link rel="stylesheet" href="../../customisations/global.css" />
    </head>
    <body>
        <nav id="main_navigation" class="swac_navigation_head" swa="Navigation FROM tbl_navigationroute WHERE filter=active,eq,true AND order=id,ASC"></nav>
        <div id="userform" swa="User"></div>
        <div id="translate" swa="Translator FROM ../../data/languages/translations.json"></div>

        <div class="section">
            <article class="uk-article">
                <h1 class="uk-heading-bullet" swac_lang="data_heatmap_headline">Heatmap</h1>
                <!-- Device and measured value, see SWAC component Dataselect. The heatmap loads as soon as both are selected. -->
                <div id="heatmap_source" class="uk-margin" swa="Dataselect FROM tbl_observedobject WHERE filter=data_collection,nis AND order=name,ASC"></div>
                <div class="heatmap_loading uk-margin" hidden>
                    <span uk-spinner="ratio: 0.8"></span> <span swac_lang="data_heatmap_loading">Loading heatmap ...</span>
                </div>
                <div id="heatmap_legend" swa="Datadescription TEMPLATE min_median_max"></div>
                <div id="heatmap_result" hidden>
                </div>
            </article>
        </div>

        <div id="favs" swa="Favourites"></div>
    </body>
</html>
